name: Daily energy brief

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python run_daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save results back to GitHub
        run: |
          git config user.name "news-robot"
          git config user.email "news-robot@users.noreply.github.com"
          git add data/news.db reports/
          git commit -m "Daily brief $(date -u +%F)" || echo "Nothing new"
          git push
